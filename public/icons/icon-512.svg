<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M64 256h384M256 64v384" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Central Icon Container -->
  <g filter="url(#shadow)">
    <!-- Escalator / Step Shapes -->
    <path d="M120 380 h80 l112 -160 h80" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 320 h60 l112 -160 h100" fill="none" stroke="#fde047" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    
    <!-- TKE Badge Text -->
    <rect x="140" y="110" width="232" height="74" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#ea580c" stroke-width="4"/>
    <text x="256" y="162" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      TK<tspan fill="#f97316">E</tspan>
    </text>

    <!-- Subtitle O.S. -->
    <rect x="190" y="385" width="132" height="38" rx="12" fill="#ea580c"/>
    <text x="256" y="411" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">
      TITS-502P
    </text>
  </g>
</svg>
